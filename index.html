<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071b13">
<title>MILOS | Özgürlüğün Yeni Yüzü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
    --page-color: #071b13;
    --green: #19a66a;
    --light-green: #8df0bd;
    --white: #f4fff8;
    --muted: #b3c8bb;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 110px; }
body {
    font-family: 'Inter', sans-serif;
    color: var(--white);
    background: var(--page-color);
    overflow-x: hidden;
    transition: background-color 1.4s cubic-bezier(0.22, 1, 0.36, 1);
    min-height: 100vh;
}
body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    background:
        radial-gradient(ellipse at 15% 15%, rgba(20,150,90,.17), transparent 45%),
        radial-gradient(ellipse at 85% 75%, rgba(0,90,55,.18), transparent 50%);
    transition: opacity 1.4s ease;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }

/* ===== LIQUID GLASS DOCK ===== */
.dock {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2000;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 14px;
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.35),
        inset 0 -1px 0 rgba(255, 255, 255, 0.08),
        0 8px 40px rgba(0, 0, 0, 0.45);
    transition: background 0.3s, box-shadow 0.3s;
}
.dock:hover {
    background: rgba(255, 255, 255, 0.13);
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.45),
        inset 0 -1px 0 rgba(255, 255, 255, 0.1),
        0 12px 50px rgba(0, 0, 0, 0.55);
}
.dock-brand {
    font-weight: 900;
    font-size: 16px;
    letter-spacing: 3px;
    padding: 0 12px 0 4px;
    color: var(--light-green);
    white-space: nowrap;
}
.dock-sep {
    width: 1px;
    height: 22px;
    background: rgba(255, 255, 255, 0.15);
    margin: 0 4px;
}
.dock-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 13px;
    border-radius: 14px;
    border: none;
    background: transparent;
    color: #d5e7dc;
    font-size: 12px;
    font-weight: 600;
    transition: background 0.25s, color 0.25s, transform 0.2s;
    white-space: nowrap;
}
.dock-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    color: var(--light-green);
}
.dock-btn.active {
    background: rgba(141, 240, 189, 0.15);
    color: var(--light-green);
}
.dock-btn .icon {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 4px;
    background: currentColor;
    opacity: 0.6;
    flex-shrink: 0;
}
.dock-btn.active .icon { opacity: 1; }

/* ===== BÖLÜMLER ===== */
section {
    position: relative;
    padding: 120px 8% 100px;
    isolation: isolate;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
}
.section-label {
    font-size: 11px;
    color: var(--light-green);
    letter-spacing: 4px;
    font-weight: 800;
    margin-bottom: 15px;
    text-transform: uppercase;
}
.section-title {
    font-size: clamp(30px, 5vw, 54px);
    font-weight: 900;
    line-height: 1.15;
    margin-bottom: 22px;
}
.section-text {
    color: var(--muted);
    line-height: 1.9;
    font-size: 15px;
    max-width: 760px;
}
.center { text-align: center; margin-left: auto; margin-right: auto; }

/* ===== HERO ===== */
.hero {
    min-height: 100vh;
    padding: 120px 5% 70px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
}
.hero-tag {
    color: var(--light-green);
    letter-spacing: 5px;
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 20px;
}
.hero-logo-img {
    width: min(220px, 45vw);
    height: auto;
    margin: 0 auto 25px;
    display: block;
    border-radius: 24px;
    object-fit: contain;
    filter: drop-shadow(0 0 40px rgba(141, 240, 189, 0.35));
}
.hero h1 {
    font-size: clamp(48px, 9vw, 100px);
    line-height: 1;
    font-weight: 900;
    letter-spacing: 12px;
    margin: 0 0 17px;
    background: linear-gradient(110deg, #fff, #9ae9bd 50%, #42b87b);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}
.hero-description {
    max-width: 620px;
    color: #c0d4c8;
    font-size: 15px;
    line-height: 1.9;
}
.hero-buttons {
    display: flex;
    gap: 13px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 30px;
}
.btn {
    padding: 14px 24px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 800;
    transition: .3s;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    border: none;
}
.btn-primary {
    background: #1b9e64;
    color: white;
    box-shadow: 0 8px 35px rgba(27,158,100,.22);
}
.btn-primary:hover {
    transform: translateY(-4px);
    background: #27bd7a;
}
.btn-outline {
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.04);
    color: white;
}
.btn-outline:hover {
    background: rgba(255,255,255,.12);
    transform: translateY(-4px);
}
.scroll-hint {
    margin-top: 45px;
    color: #8da99a;
    font-size: 10px;
    letter-spacing: 3px;
}

/* ===== KARTLAR ===== */
.glass-card {
    background: linear-gradient(135deg, rgba(255,255,255,.09), rgba(255,255,255,.025));
    border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(18px);
    border-radius: 22px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,.12);
    transition: transform .35s, border-color .35s, background .35s;
}
.glass-card:hover {
    transform: translateY(-7px);
    border-color: rgba(130,235,175,.4);
    background: rgba(255,255,255,.09);
}
.grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
    margin-top: 48px;
}
.card-number {
    font-size: 13px;
    color: var(--light-green);
    letter-spacing: 3px;
    font-weight: 900;
    margin-bottom: 18px;
}
.glass-card h3 {
    font-size: 21px;
    margin-bottom: 13px;
}
.glass-card p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.8;
}

/* ===== HAKKIMIZDA / MILOS ===== */
.about-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 50px;
    align-items: center;
    margin-top: 45px;
}
.about-image {
    width: 100%;
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 25px 70px rgba(0,0,0,.25);
}
.os-features {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 13px;
    margin-top: 25px;
}
.feature {
    padding: 17px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px;
    background: rgba(255,255,255,.04);
    color: #d9eee1;
    font-size: 13px;
}
.feature strong {
    display: block;
    color: var(--light-green);
    margin-bottom: 6px;
}

/* ===== BURSA ===== */
.bursa-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 45px;
    margin-top: 40px;
}
.bursa-layout img {
    width: 100%;
    border-radius: 22px;
    max-height: 390px;
    object-fit: cover;
}
.bursa-fact {
    margin-top: 22px;
    padding: 18px;
    border-left: 3px solid #54d997;
    background: rgba(255,255,255,.05);
    color: #d7eadf;
    line-height: 1.8;
}

/* ===== KIRMIZI TEMA BÖLÜMLER ===== */
section.red-theme {
    background: #1a0a0a;
    transition: background-color 1.4s cubic-bezier(0.22, 1, 0.36, 1);
}
section.red-theme .section-label { color: #ff9e9e; }
section.red-theme .glass-card { border-color: rgba(255, 120, 120, 0.2); }
section.red-theme .glass-card:hover { border-color: rgba(255, 150, 150, 0.5); }
section.red-theme .section-text { color: #d4b8b8; }
section.red-theme .card-number { color: #ff9e9e; }
section.red-theme .glass-card p { color: #c4a8a8; }

.red-overlay {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(ellipse at 20% 20%, rgba(180, 40, 40, .25), transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(120, 20, 20, .28), transparent 55%);
    opacity: 0;
    transition: opacity 1.4s cubic-bezier(0.22, 1, 0.36, 1);
}
.red-overlay.active { opacity: 1; }

.ataturk-gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-top: 40px;
}
.ataturk-gallery img {
    width: 100%;
    height: 320px;
    object-fit: cover;
    object-position: center top;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.13);
    transition: transform .4s;
    filter: saturate(.85);
}
.ataturk-gallery img:hover {
    transform: scale(1.025);
    filter: saturate(1);
}

/* ===== TIMELINE ===== */
.timeline {
    position: relative;
    max-width: 900px;
    margin: 55px auto 0;
}
.timeline::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    background: linear-gradient(transparent, #c44, #c44, transparent);
    transform: translateX(-50%);
}
.timeline-item {
    width: 50%;
    padding: 0 35px 35px 0;
    position: relative;
}
.timeline-item:nth-child(even) {
    margin-left: 50%;
    padding: 0 0 35px 35px;
}
.timeline-item::after {
    content: "";
    position: absolute;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #ff8a8a;
    border: 4px solid #1a0a0a;
    right: -9px;
    top: 20px;
    box-shadow: 0 0 20px #c44;
}
.timeline-item:nth-child(even)::after {
    right: auto;
    left: -9px;
}
