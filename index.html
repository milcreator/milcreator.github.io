<title>MILOS | Özgür ve Yerli İşletim Sistemi</title>

:root {
    --bg: #071b12;
    --surface: #10291d;
    --text: #f4fff7;
    --muted: #b8cbbd;
    --accent: #36a66a;
    --border: rgba(255,255,255,.12);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background 1s ease, color 1s ease;
}

body.red-theme {
    --bg: #210609;
    --surface: #3b0b12;
    --text: #fff5f5;
    --muted: #e0bfc2;
    --accent: #c52c3e;
    --border: rgba(255,255,255,.15);
}

header {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
    background: rgba(5, 20, 13, .88);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid var(--border);
    transition: background 1s ease;
}

body.red-theme header {
    background: rgba(35, 5, 10, .9);
}

nav {

    margin: auto;

}

.logo {

    align-items: center;
    gap: 12px;
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 2px;
}

.logo img {
    width: 42px;
    height: 42px;
    object-fit: contain;
}

nav ul {
    display: flex;
    list-style: none;
    gap: 25px;
    flex-wrap: wrap;
}

nav a {
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    transition: color .4s ease;
}

nav a:hover {
    color: var(--accent);
}
